{% extends "base.html" %}

{% block title %}Japanese Auction{% endblock %}

{% block content %}
<div class="page-center">
  <div class="card">
    <h1 class="app-title">Japanese Auction</h1>
    <p class="subtitle">Create a new auction and share the QR code with bidders.</p>
    <form method="POST" action="/create">
      <div class="form-group">
        <label for="title">Auction Title</label>
        <input type="text" id="title" name="title" placeholder="e.g. Vintage Watch" required>
      </div>
      <div class="form-group">
        <label for="starting_price">Starting Price ($)</label>
        <input type="number" id="starting_price" name="starting_price" value="0" min="0" required>
      </div>
      <div class="form-group">
        <label for="increment">Price Increment ($)</label>
        <input type="number" id="increment" name="increment" value="10" min="1" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create Auction</button>
    </form>
  </div>
</div>
{% endblock %}
